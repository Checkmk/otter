name = "session-resume-test"
type = "looping"

[[steps]]
type = "agent"
session = "planner"
provider = "claude"
message = "Remember 'PINEAPPLE' and repeat this if someone asks. Respond only with 'Acknowledged.'"

[[steps]]
type = "checkpoint"
message = "Agent should have acknowledged. Continue to test session resume."

[[steps]]
type = "agent"
session = "planner"
message = "What should you remember? Respond with only the word."

[[steps]]
type = "checkpoint"
message = "Agent should have responded with PINEAPPLE, confirming session context was preserved."
