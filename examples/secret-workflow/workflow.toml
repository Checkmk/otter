name = "secret-workflow"
type = "triggered"
schema = 1
version = "0.1.0"
description = "End-to-end demo of the secrets flow: prompt at install time, store in the OS keyring, inject as env at runtime."

# Showcase the secrets isolation flow end-to-end.
#
# At install time `otter workflow install` prompts for TEST_API_KEY and stores
# it encrypted in the OS keyring (visible in `otter secret list`). The workflow
# declares the same name in `requires = [...]` so the value is injected into
# the step's env at runtime.
#
#   otter workflow install examples/secret-workflow
#   otter start secret-workflow
#
# Expected output in the TUI logs:
#   key=<the value you entered>    (secret was injected)
#   canary=absent                  (daemon env did not leak)

[trigger]
type = "manual"

[require.TEST_API_KEY]
description = "Example secret for the canary test (any non-empty string)"
sensitive = true

# Step 1: The declared secret is injected and the daemon env is isolated.
[[steps]]
type = "shell"
command = ["bash", "-c", "echo key=${TEST_API_KEY} canary=${OTTER_TEST_CANARY:-absent}"]
requires = ["TEST_API_KEY"]

# Step 2: An undeclared secret is NOT available (different step, no requires field).
[[steps]]
type = "shell"
command = ["bash", "-c", "echo undeclared=${TEST_API_KEY:-not-visible}"]

[[steps]]
type = "notify"
message = "secrets-test completed — check logs for key= and undeclared= lines."
