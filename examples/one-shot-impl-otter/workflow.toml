name = "one-shot-impl-otter"
type = "triggered"
schema = 1
version = "0.1.0"
description = "Hand Claude a feedback prompt, let it implement and commit the change in a single session."

[trigger]
type = "manual"

[require.REPO_PATH]
description = "Absolute path to your local git clone"
default = "~/your-repo"

[require.POOL_DIR]
description = "Directory under which pooled worktree slots live (created if missing)"
default = "~/.cache/otter-git-pool"

[workspace]
type = "git"
base_repo = "{{REPO_PATH}}"
ref = "HEAD"

[workspace.pool]
dir = "{{POOL_DIR}}"
keep_directory_on = ["failed"]

[[steps]]
type = "agent"
provider = "claude"
session = "one-shot-session"
permission_mode = "acceptEdits"
allowed_tools = [
    "Read",
    "Bash(git add:*)",
    "Bash(git commit:*)",
    "Bash(git checkout -b otter-impl-*)",
    "Bash(git switch otter-impl-*)",
    "Bash(git branch otter-impl-*)"
]
message = """
You will be given a task to implement. When you receive the task, first
create a new branch off the current HEAD named 'otter-impl-<topic>' where
<topic> is a shorthand for the task.
Print 'Ready for the task.' when you are ready to receive the task.
"""

[[steps]]
type = "checkpoint"
message = """

Describe what you want implemented as feedback.
Continue to commit the implementation.
"""

[[steps]]
type = "agent"
provider = "claude"
session = "one-shot-session"
message = """
Write a compact commit message of the implemented changes.
Focus on what and why something was done, not how.
The first line should be at most 50 characters long.
Stage and commit the changes using 'git add' and 'git commit'.
"""
