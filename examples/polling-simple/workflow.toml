name = "polling-simple"
type = "triggered"

[trigger]
type = "polling"
poll_command = ["polling-simple.sh", "--poll"]
context_command = ["polling-simple.sh", "--context"]
interval_secs = 5

[[steps]]
type = "shell"
command = ["ls", "-la", "trigger-context/"]

[[steps]]
type = "shell"
command = ["cat", "trigger-context/metadata.txt"]

[[steps]]
type = "notify"
message = "Polling test completed successfully!"
