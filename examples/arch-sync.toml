name = "arch-sync"
kind = "indefinite"

[[steps]]
type = "workspace"
path = "."

[[steps]]
type = "agent"
command = ["claude", "--print", "--allowed-tools", "Write,Read"]
output_file = "plan.md"
message = "Save the final plan to plan.md: Review README.md and TARGET_ARCHITECTURE.md and the current code. Identify the most crucial difference and create an implementation plan."

[[steps]]
type = "checkpoint"
message = "Review the agent's plan. Accept to proceed with implementation, reject to stop."

[[steps]]
type = "agent"
command = ["claude", "--print", "--permission-mode", "acceptEdits"]
message = "Read plan.md and implement it."

[[steps]]
type = "checkpoint"
message = "Review the implementation. Accept to continue to next iteration, reject to stop."
