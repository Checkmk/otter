name = "secret-workflow"
type = "triggered"

# Showcase the secrets isolation flow end-to-end.
#
# Before running, store a test secret:
#   otter secret set TEST_API_KEY "my-test-value"
#
# Then install and start:
#   otter workflow install examples/secret-workflow.toml
#   otter start secret-workflow
#
# Expected output in the TUI logs:
#   key=my-test-value   (secret was injected)
#   canary=absent       (daemon env did not leak)

[trigger]
type = "manual"

# Step 1: The declared secret is injected and the daemon env is isolated.
[[steps]]
type = "shell"
command = ["bash", "-c", "echo key=${TEST_API_KEY} canary=${OTTER_TEST_CANARY:-absent}"]
secrets = ["TEST_API_KEY"]

# Step 2: An undeclared secret is NOT available (different step, no secrets field).
[[steps]]
type = "shell"
command = ["bash", "-c", "echo undeclared=${TEST_API_KEY:-not-visible}"]

[[steps]]
type = "notify"
message = "secrets-test completed — check logs for key= and undeclared= lines."
