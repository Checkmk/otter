name = "arch-sync"
type = "looping"
schema = 1
version = "0.1.0"
description = "Iteratively re-align code with README/TARGET_ARCHITECTURE.md using Claude, pausing for review between plan and implementation."

# Point to the correct absolute path of the repository
# [workspace]
# type = "fixed"
# path = "."

[[steps]]
type = "agent"
provider = "claude"
allowed_tools = ["Write", "Read"]
message = "Save the final plan to plan.md (overwriting it if required): Review README.md, TARGET_ARCHITECTURE.md and the current code. Identify the best next step to align them and create an implementation plan."

[[steps]]
type = "checkpoint"
message = "Review the agent's plan."

[[steps]]
type = "agent"
provider = "claude"
permission_mode = "acceptEdits"
message = "Read plan.md and implement it."

[[steps]]
type = "checkpoint"
message = "Review the implementation."
