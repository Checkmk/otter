name = "polling-debug"
type = "triggered"

[trigger]
type = "polling"
# Paths are relative to daemon's working directory (usually repo root when running with cargo)
poll_command = ["examples/polling-simple.sh", "--poll"]
context_command = ["examples/polling-simple.sh", "--context"]
interval_secs = 5

[[steps]]
type = "shell"
command = ["ls", "-la", "trigger-context/"]

[[steps]]
type = "shell"
command = ["cat", "trigger-context/metadata.txt"]

[[steps]]
type = "notify"
message = "Polling test completed successfully!"
